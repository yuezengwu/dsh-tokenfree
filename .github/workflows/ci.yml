name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --prod --audit-level high
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: pnpm pack --out "$RUNNER_TEMP/dsh-tokenfree.tgz"
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: dsh-tokenfree-package
          path: ${{ runner.temp }}/dsh-tokenfree.tgz
          if-no-files-found: error

  assembled:
    needs: check
    name: DSH ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 0.2.1-rc.3
            sha: 1f81c047fc48fa190a683e469daa699857e9afe8
          - version: 0.2.1-rc.4
            sha: 504a01a9578abc2c6f1fb896b1dc322c9fe24f66
          - version: 0.2.1-rc.5
            sha: b830ec950faba0a46dda564be3e2d854afed94f1
          - version: 0.2.2-alpha.2
            sha: f3803c96974ad4a94195fb97e5c637e9c2a3afe3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ matrix.sha }}
          path: .dsh-source
          persist-credentials: false
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: .dsh-source
      - uses: actions/download-artifact@v4
        with:
          name: dsh-tokenfree-package
          path: ${{ runner.temp }}/tokenfree-package
      - run: node scripts/verify-host.mjs
        env:
          DSH_SOURCE_DIR: ${{ github.workspace }}/.dsh-source
          DSH_TOKENFREE_INSTALL_SPEC: ${{ runner.temp }}/tokenfree-package/dsh-tokenfree.tgz
